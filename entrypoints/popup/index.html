<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slop Detect</title>
    <style>
      body {
        width: 300px;
      }
    </style>
  </head>
  <body>
    <h1>Slop Detect</h1>

    <label><input type="checkbox" id="enabled" /> Mark AI-written posts and comments</label>
    <div id="sites"></div>

    <h2>Model</h2>
    <p id="status">Starting</p>
    <progress id="progress" max="1" value="0" hidden></progress>
    <p id="download-note" class="muted" hidden>
      The model runs on this computer: no text leaves the browser. It is a 450 MB download, kept until you delete it.
    </p>
    <button id="download" class="primary" hidden>Download model (450 MB)</button>

    <footer>
      <a id="open-log">Log</a>
      <a id="open-options">Options</a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
