name: release

on:
  release:
    types: [published]

permissions:
  contents: write # to attach the zips to the release

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes are made from the history
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The store refuses a version it has seen, and the manifest takes its version from package.json.
      - name: The tag must match the version in package.json
        run: test "${TAG#v}" = "$(node -p "require('./package.json').version")"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run zip
      - run: npm run zip -- -b firefox
      - run: gh release upload "$TAG" .output/*-chrome.zip .output/*-firefox.zip .output/*-sources.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      # GitHub's generated notes list pull requests, and this repo commits to main:
      # the notes are the commit subjects since the tag before this one.
      - name: Write the release notes, unless the release has some
        if: github.event.release.body == ''
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git log --pretty='- %s' ${previous:+"$previous.."}"$TAG" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
